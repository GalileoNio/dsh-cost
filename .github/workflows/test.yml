name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The plugin is not published to a registry, so install its declared
      # dependencies straight from the manifest. Nothing else is needed: the
      # harness's React and Cordis arrive through its own module table, and the
      # suites stub both.
      - run: npm install --no-audit --no-fund
      - run: npm test
